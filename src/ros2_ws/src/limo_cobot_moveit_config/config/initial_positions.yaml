# Used only by the fake/mock controller manager (not used with Gazebo).
#
# MUST match the real arm's actual current pose before every hardware session, not a
# placeholder. If this disagrees with reality, MoveIt's first plan is computed from a
# false starting point and the real arm — driven by arm_bridge.py, which mirrors
# /joint_states verbatim with no ramped safety move — can snap hard trying to reach it.
#
# Read from the real arm via `mc.get_angles()` (pymycobot) and converted deg -> rad.
# Captured 2026-08-10, real arm on /dev/ttyACM0 (Jetson), right after commanding all
# joints to [0,0,0,0,0,0] post-recalibration. Confirmed by eye: all six notch marks
# are physically aligned at this pose, matching the near-zero readings below -- the
# recalibration (M5Stack screen, notch alignment) is verified correct, not just
# self-consistent in software. Small sub-degree residuals are normal servo
# deadband/resolution, not error.
initial_positions:
  joint2_to_joint1: -0.0138
  joint3_to_joint2: 0.0061
  joint4_to_joint3: -0.0106
  joint5_to_joint4: -0.0168
  joint6_to_joint5: 0.0122
  joint6output_to_joint6: 0.0138
