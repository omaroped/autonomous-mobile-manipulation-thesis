# MoveIt drives ONLY the arm trajectory controller. The gripper is intentionally
# excluded — it is commanded directly via /mycobot_gripper_controller/commands
# (Float64MultiArray) by the orchestrator, which keeps the working gripper path
# untouched and out of MoveIt's controller manager.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - mycobot_arm_controller

  mycobot_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
