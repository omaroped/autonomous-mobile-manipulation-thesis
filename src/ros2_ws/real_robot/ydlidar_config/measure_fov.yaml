# MEASUREMENT ONLY -- not for navigation.
# Deploy to: ~/limo_ros2_ws/src/ydlidar_ros2_driver/params/measure_fov.yaml
#
# Full 360 deg and a very low range_min so the robot's own chassis/arm
# reflections are VISIBLE rather than filtered out. Used with fov_scan.py to
# measure which angles the robot blocks.
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_link
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    sample_rate: 4
    intensity_bit: 8
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    range_min: 0.02
    frequency: 10.0
    invalid_range_is_inf: false
