get_planning_scene_server:
  ros__parameters:
    # ── Camera topics ──────────────────────────────────────────────────────────
    point_cloud_topic: /depth/points
    rgb_image_topic: /rgb/image_raw
    target_frame: base_link

    # ── Cropping (in target_frame = base_link) ─────────────────────────────────
    # Keep generous margins so the box on the table is never clipped.
    enable_cropping: true
    crop_min_x: -0.2
    crop_max_x:  1.0
    crop_min_y: -0.8
    crop_max_y:  0.8
    crop_min_z:  0.0
    crop_max_z:  1.0

    # ── Plane segmentation ─────────────────────────────────────────────────────
    max_plane_segmentation_iterations: 1000
    plane_segmentation_distance_threshold: 0.008
    # z_tolerance raised to 0.35 so the ground plane is detected correctly
    # when base_link sits ~15 cm above the floor in Gazebo.
    z_tolerance: 0.15
    angle_tolerance: 0.90
    min_cluster_size: 50          # was 100 — small boxes produce fewer points
    max_cluster_size: 1000000
    cluster_tolerance: 0.03       # was 0.02 — slightly looser for sparse depth

    # ── Normal / curvature / RSD estimation ───────────────────────────────────
    k_neighbors: 30
    rsd_radius: 0.02

    # ── Region-growing clustering ──────────────────────────────────────────────
    nearest_neighbors: 30
    smoothness_threshold: 25.0    # was 20.0 — allow a bit more surface variation
    curvature_threshold: 0.5      # was 0.2  — don't reject curved-ish surfaces

    # ── Object segmentation (RANSAC + Hough) ──────────────────────────────────
    num_iterations: 3             # 3 is sufficient for box on table; 8 caused 5+ min hangs
    inlier_threshold: 30          # was 85 — a 3 cm box has far fewer than 85 pts

    hough_radius_bins: 20         # was 50 — quadratic savings in Hough voting
    hough_center_bins: 20         # was 50

    # KEY FIX: 1 mm was impossibly tight for Gazebo depth noise (~3-5 mm).
    # 8 mm gives robust fits without accepting gross outliers.
    ransac_distance_threshold: 0.008   # was 0.001

    ransac_max_iterations: 100    # was 1000 — 100 is plenty for flat-top boxes

    # ── Circle / cylinder filtering ───────────────────────────────────────────
    circle_min_cluster_size: 10        # was 20 — small cylinders
    circle_max_clusters: 3             # was 2  — noise can fragment a ring
    circle_height_tolerance: 0.04      # was 0.025
    circle_curvature_threshold: 0.001  # was 0.0015 — keep more points
    circle_radius_tolerance: 0.030     # was 0.020
    circle_normal_angle_threshold: 0.3 # was 0.2  — looser normal check
    circle_cluster_tolerance: 0.035    # was 0.025

    # ── Line / box filtering ──────────────────────────────────────────────────
    line_min_cluster_size: 10          # was 20
    line_max_clusters: 3               # was 2  — noise fragments box edges
    # KEY FIX: 0.0011 rejected nearly every point on a flat surface.
    # Flat surfaces have low curvature (~0.002-0.005 in simulation).
    line_curvature_threshold: 0.010    # was 0.0011
    line_cluster_tolerance: 0.035      # was 0.025
    line_rho_threshold: 0.015          # was 0.01
    line_theta_threshold: 0.15         # was 0.1

    output_directory: /tmp/
