mtc_node:
  ros__parameters:
    # ── General ─────────────────────────────────────────────────────────────
    execute: true
    max_solutions: 10

    # ── Controllers ──────────────────────────────────────────────────────────
    # Must match the controller names in limo_cobot_moveit_config
    controller_names: ["arm_controller", "mycobot_gripper_controller"]

    # ── Robot groups (must match limo_cobot.srdf) ────────────────────────────
    arm_group_name: "arm"
    gripper_group_name: "gripper"
    gripper_frame: "gripper_tcp"
    gripper_open_pose: "gripper_open"
    gripper_close_pose: "gripper_closed"
    arm_home_pose: "home"

    world_frame: "base_link"

    # ── Object parameters (overridden by perception; these are fallbacks) ────
    object_name: "target_object"
    object_type: "box"
    object_reference_frame: "base_link"
    object_dimensions: [0.03, 0.03, 0.03]
    object_pose: [0.30, 0.0, 0.030, 0.0, 0.0, 0.0]

    # ── Grasp frame [x, y, z, roll, pitch, yaw] ─────────────────────────────
    # Small Z offset so the gripper approaches from above the box top
    grasp_frame_transform: [0.0, 0.026, 0.0, 1.2, 0.0, 0.0]

    # ── Place pose [x, y, z, roll, pitch, yaw] ──────────────────────────────
    # Within arm reach (~25 cm) from pick table — place next to the object
    place_pose: [0.28, 0.12, 0.025, 0.0, 0.0, 0.0]

    # ── Approach motion (Cartesian, along gripper Z toward object) ───────────
    approach_object_min_dist: 0.005
    approach_object_max_dist: 0.15

    # ── Lift motion (along world Z, upward) ──────────────────────────────────
    lift_object_min_dist: 0.04
    lift_object_max_dist: 0.12

    # ── Lower motion (along world Z, downward) ───────────────────────────────
    lower_object_min_dist: 0.04
    lower_object_max_dist: 0.12

    # ── Timeout parameters ───────────────────────────────────────────────────
    move_to_pick_timeout: 15.0
    move_to_place_timeout: 15.0

    # ── Grasp generation ─────────────────────────────────────────────────────
    grasp_pose_angle_delta: 0.2618   # 15 deg — fewer samples → faster planning
    grasp_pose_max_ik_solutions: 8
    grasp_pose_min_solution_distance: 0.5

    # ── Place generation ─────────────────────────────────────────────────────
    place_pose_max_ik_solutions: 4

    # ── Cartesian planner ────────────────────────────────────────────────────
    cartesian_max_velocity_scaling: 0.5
    cartesian_max_acceleration_scaling: 0.5
    cartesian_step_size: 0.002

    # ── Direction vectors ────────────────────────────────────────────────────
    approach_object_direction_z: 1.0    # gripper Z forward (toward object)
    lift_object_direction_z: 1.0        # world Z up
    lower_object_direction_z: -1.0      # world Z down
    retreat_direction_z: -1.0           # gripper Z backward

    # ── Other ────────────────────────────────────────────────────────────────
    place_pose_z_offset_factor: 0.5
    retreat_min_distance: 0.02
    retreat_max_distance: 0.12
